: CLahe

[preprocessing]
gaussian_ksize  = 0
gaussian_sigma  = 0
median_ksize    = 1
equalize_hist = 0
clahe         = 1
clahe_clip    = 2.0
clahe_tile    = 8

[hough]
dp          = 1.5
minDist     = 300    # era 100 — impede múltiplos círculos próximos
param1      = 100
param2      = 60     # era 40 — exige mais votos, só círculos fortes passam
minRadius   = 100    # ajuste conforme o tamanho do prato nas suas imagens
maxRadius   = 500    # ajuste conforme o tamanho do prato nas suas imagens

[output]
max_circles       = 1   # era 0 — força no máximo 1 círculo por imagem
resize_width      = 0
save_preprocessed = 1