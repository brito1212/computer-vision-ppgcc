# ─── Parâmetros da Transformada de Hough ─────────────────────────────────────
#
# dp          – resolução do acumulador relativa à imagem (1.0 = igual, 2.0 = metade)
# minDist     – distância mínima entre centros de círculos detectados (pixels)
# param1      – limiar superior do Canny interno (o inferior é param1/2)
# param2      – limiar do acumulador: MENOR = mais detecções, mais falsos positivos
# minRadius   – raio mínimo dos círculos buscados (pixels)
# maxRadius   – raio máximo dos círculos buscados (pixels); 0 = sem limite
#
# ─── Pré-processamento ────────────────────────────────────────────────────────
#
# gaussian_ksize   – tamanho do kernel Gaussiano (deve ser ímpar; 0 = desativado)
# gaussian_sigma   – sigma do filtro Gaussiano
# median_ksize     – tamanho do kernel da mediana (deve ser ímpar; 0 = desativado)
# equalize_hist    – equalização de histograma global (0 = desativado, 1 = ativado)
# clahe            – equalização CLAHE, melhor para iluminação não uniforme (0/1)
# clahe_clip       – clip limit do CLAHE
# clahe_tile       – tamanho do tile do CLAHE (NxN)
#
# ─── Saída ────────────────────────────────────────────────────────────────────
#
# max_circles – máximo de círculos desenhados por imagem (0 = todos)
# resize_width – redimensionar imagem para esta largura antes de processar (0 = sem redimensionamento)


